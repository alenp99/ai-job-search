<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Job Search</title>
<meta name="description" content="An AI-powered job application framework built on Claude Code: evaluate postings, tailor your CV, write cover letters, and prepare for interviews.">
<link rel="icon" href="assets/mascot/pip_flight_loop.gif">
<style>
  :root {
    --bg: #fbfaf7; --fg: #1f2328; --muted: #59636e; --border: #e3e0d8;
    --accent: #c2410c; --code-bg: #f1eee6; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e6e6e3; --muted: #9aa0a6; --border: #2c3036;
      --accent: #fb923c; --code-bg: #1e2228; --card: #1a1d22;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  header.top {
    position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
  }
  header.top .inner {
    max-width: 880px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header.top a.brand { font-weight: 700; color: var(--fg); text-decoration: none; }
  header.top nav a { color: var(--muted); text-decoration: none; margin-left: 16px; font-size: 14px; }
  header.top nav a:hover { color: var(--accent); }
  main { max-width: 880px; margin: 0 auto; padding: 32px 16px 80px; }
  #content { overflow-wrap: anywhere; }
  h1, h2, h3, h4 { line-height: 1.25; margin: 2em 0 .6em; scroll-margin-top: 72px; }
  h1 { font-size: 2.4rem; margin-top: .4em; letter-spacing: -0.02em; }
  h2 { font-size: 1.6rem; padding-bottom: .3em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.2rem; }
  a { color: var(--accent); }
  p, ul, ol, table, pre, blockquote { margin: 0 0 1.1em; }
  img { max-width: 100%; height: auto; }
  code {
    font: 0.88em/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg); padding: .15em .4em; border-radius: 4px;
  }
  pre {
    background: var(--code-bg); padding: 14px 16px; border-radius: 8px;
    overflow-x: auto; border: 1px solid var(--border);
  }
  pre code { background: none; padding: 0; font-size: 0.85em; }
  blockquote {
    border-left: 4px solid var(--accent); margin-left: 0; padding: .4em 1em;
    color: var(--muted); background: var(--card); border-radius: 0 6px 6px 0;
  }
  blockquote p:last-child { margin-bottom: 0; }
  table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
  th, td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; vertical-align: top; }
  th { background: var(--card); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
  details { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; margin-bottom: 1em; }
  summary { cursor: pointer; font-weight: 600; }
  footer { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; color: var(--muted); font-size: 14px; border-top: 1px solid var(--border); }
  .loading { color: var(--muted); }
  @media (max-width: 600px) {
    h1 { font-size: 1.9rem; }
    header.top nav a.opt { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <a class="brand" href="#">AI Job Search</a>
    <nav>
      <a class="opt" href="#quick-start">Quick start</a>
      <a href="https://github.com/MadsLorentzen/ai-job-search">GitHub</a>
    </nav>
  </div>
</header>
<main>
  <article id="content"><p class="loading">Loading…</p></article>
</main>
<footer>
  Rendered from the project <a href="https://github.com/MadsLorentzen/ai-job-search/blob/main/README.md">README</a>.
  MIT licensed. Not affiliated with Anthropic.
</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  const REPO = "https://github.com/MadsLorentzen/ai-job-search";
  const slug = (s) => s.toLowerCase().trim()
    .replace(/<[^>]+>/g, "")
    .replace(/[^\p{L}\p{N}\s_-]/gu, "")
    .replace(/\s/g, "-");

  const renderer = new marked.Renderer();
  renderer.heading = (text, level, raw) => `<h${level} id="${slug(raw)}">${text}</h${level}>`;

  // Point repo-relative links (other docs, ../../releases) at GitHub; keep anchors and local assets.
  const fixHref = (href) => {
    if (!href || /^(https?:|mailto:|#)/.test(href)) return href;
    if (href.startsWith("assets/")) return href;
    if (href.startsWith("../../")) return `${REPO}/${href.slice(6)}`;
    return `${REPO}/blob/main/${href}`;
  };

  fetch("README.md")
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then((md) => {
      const el = document.getElementById("content");
      el.innerHTML = marked.parse(md, { renderer, gfm: true });
      el.querySelectorAll("a[href]").forEach((a) => {
        a.setAttribute("href", fixHref(a.getAttribute("href")));
        if (/^https?:/.test(a.href) && !a.href.startsWith(location.origin)) a.rel = "noopener";
      });
      if (location.hash) document.querySelector(decodeURIComponent(location.hash))?.scrollIntoView();
    })
    .catch(() => {
      document.getElementById("content").innerHTML =
        `<p>Couldn't load the README. <a href="${REPO}">View it on GitHub</a>.</p>`;
    });
</script>
</body>
</html>
